<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Chequer</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<meta name="google-site-verification"
		      content="aU4beAyQUMQ8faEKSQll8MryzoITx9HXYOPklIvxQVY"
		>
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&display=swap" rel="stylesheet">
	</head>
	<body class="bg-zinc-900">
		<div id="app" class="text-center max-w-xl mx-auto">
			<div class="flex flex-col relative">
				<div class="relative grow">
					<img src="/cheque.webp" width="100%">
					<span id="textual-value" dir="rtl" class="absolute top-[35%] right-[35%] text-[2.8cqw] font-bold text-blue-500">الفا دينار</span>
					<span id="num-value" class="absolute top-[5%] right-[12%] text-[3cqw] font-bold text-blue-500">2000</span>
					<span id="person" dir="rtl" class="absolute top-[48%] right-[36%] text-[2.8cqw] font-bold text-blue-500">نفس الشخص</span>
					<span id="date-value" dir="rtl" class="absolute top-[58%] right-[5%] text-[2.8cqw] font-bold text-blue-500">08/09/2026</span>
					<span id="date-value" dir="rtl" class="absolute top-[75%] right-[15%] text-[2.8cqw] font-bold text-blue-500">امضاء</span>
				</div>
				<div class="bills grid pt-4 pb-14">
					<div class="p-2">
						<img src="/2000da.jpg" height="95" width="200" class="inline">
						<input id="2000da-input" type="number" maxlength="2" placeholder="0" value="" class="font-bold text-sm text-white inline outline-none focus:border-blue-500 py-2.5 px-3 bg-zinc-600 rounded-lg w-18">
					</div>
					<div class="p-2">
						<img src="/1000da.jpg" height="95" width="200" class="inline">
						<input id="1000da-input" type="number" maxlength="2" placeholder="0" value="" class="font-bold text-sm text-white inline outline-none focus:border-blue-500 py-2.5 px-3 bg-zinc-600 rounded-lg w-18">
					</div>
					<div class="p-2">
						<img src="/500da.jpg" height="95" width="200" class="inline">
						<input id="500da-input" type="number" maxlength="2" placeholder="0" value="" class="font-bold text-sm text-white inline outline-none focus:border-blue-500 py-2.5 px-3 bg-zinc-600 rounded-lg w-18">
					</div>
					<div class="p-2">
						<img src="/200da.jpg" height="95" width="200" class="inline">
						<input id="200da-input" type="number" maxlength="2" placeholder="0" value="" class="font-bold text-sm text-white inline outline-none focus:border-blue-500 py-2.5 px-3 bg-zinc-600 rounded-lg w-18">
					</div>
					<div class="p-2">
						<img src="/100da.jpg" height="95" width="200" class="inline h-[95px] object-contain">
						<input id="100da-input" type="number" maxlength="2" placeholder="0" value="" class="font-bold text-sm text-white inline outline-none focus:border-blue-500 py-2.5 px-3 bg-zinc-600 rounded-lg w-18">
					</div>
				</div>
				<div class="text-center w-full text-xs text-gray-500 mb-20">Chequer - made by <a href="https://github.com/rehhouari" target="_blank" class="underline">rafik</a></div>
				<div class="text-center items-center w-full max-w-xl mx-auto px-2 fixed bottom-0">
					<input id="num-input" type="number" maxlength="8" minlength="3" placeholder="2000" autofocus="on" class="mx-auto w-full outline-none font-bold text-lg text-center py-2.5 px-3 block border-4 border-zinc-400 rounded-md focus:border-blue-500 bg-zinc-600 text-white">
				</div>
			</div>
			<div id="pwa-toast"
			     role="alert"
			     aria-labelledby="toast-message"
			>
				<div class="message">
					<span id="toast-message"></span>
				</div>
				<div class="buttons">
					<button id="pwa-refresh" type="button">
						Reload
					</button>
					<button id="pwa-close" type="button">
						Close
					</button>
				</div>
			</div>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
